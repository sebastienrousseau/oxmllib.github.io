#
# Builds oxmllib.com and publishes it to GitHub Pages.

name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Cache the ssg binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/ssg
          key: cargo-ssg-${{ runner.os }}-0.0.63

      - name: Install ssg
        run: command -v ssg || cargo install ssg --version 0.0.63 --locked

      - name: Build the site
        run: make build

      - name: Run quality gates
        run: make check

      - name: Ensure CNAME, .nojekyll, and 404 in build output
        run: |
          cp CNAME public/CNAME
          touch public/.nojekyll
          cp public/404/index.html public/404.html

      - name: Verify generated artifacts
        run: |
          for f in .nojekyll CNAME 404.html agents.txt llms.txt llms-full.txt; do
            if [ -e "public/$f" ]; then echo "ok      $f"; else echo "::error::missing $f"; exit 1; fi
          done

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
